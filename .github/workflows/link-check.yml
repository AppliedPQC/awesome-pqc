name: Link check

# This list's value is that its links are verified, so verification runs
# on every change and weekly, rather than resting on a claim in the README.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every link in README.md
        run: |
          set -uo pipefail
          # nsa.gov, cisa.gov and nccoe.nist.gov answer automated clients with
          # 403 regardless of liveness, so they are described in the README
          # rather than linked, and skipped here for the same reason.
          # datatracker.ietf.org (403) and pq-crystals.org (429) do the same but
          # are kept in the README as the authoritative sources for what they
          # link, confirmed through RFC Editor records; see its Limits.
          # x.com is the header badge's profile link, which refuses requests
          # from GitHub's runners (403) while answering browsers.
          skip='nsa\.gov|cisa\.gov|nccoe\.nist\.gov|datatracker\.ietf\.org|pq-crystals\.org|x\.com/'
          grep -oE 'https?://[^)" ]+' README.md | sed 's/[.,]$//' | sed 's/#.*//' \
            | sort -u | grep -vE "$skip" > urls.txt
          echo "checking $(wc -l < urls.txt) distinct URLs"
          fail=0
          while read -r u; do
            # The runner's shell is `bash -e`, so curl's own failures are caught
            # here rather than ending the script. Transport errors are retried,
            # and a status the server did send counts even if the body transfer
            # then failed (curl exit 23 on a write error after the response
            # began, which some hosts produce intermittently for runner IPs).
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 \
                        --retry 3 --retry-all-errors --retry-delay 2 \
                        --max-redirs 5 -A 'Mozilla/5.0 (link-check)' "$u") && rc=0 || rc=$?
            case "$rc:$code" in
              0:*|*:200|*:206) ;;
              *) code="curl-$rc" ;;
            esac
            case "$code" in
              200|206) ;;
              *) echo "::error::$code $u"; fail=$((fail+1)) ;;
            esac
          done < urls.txt
          if [ "$fail" -gt 0 ]; then
            echo "$fail dead or unreachable link(s)"
            exit 1
          fi
          echo "all links OK"
